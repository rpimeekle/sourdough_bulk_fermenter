name: Web app on GitHub Pages

# Publishes webapp/public to GitHub Pages at
#   https://<owner>.github.io/<repository>/
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "webapp/public/**"
      - ".github/workflows/webapp-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/webapp-tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/public

      - id: deployment
        uses: actions/deploy-pages@v5
