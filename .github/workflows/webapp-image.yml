name: Web app container image

# Builds the web app image and publishes it to GitHub Container Registry as
#   ghcr.io/<repository owner>/sourdough-webapp
# Tags: "latest" from the default branch, "1.2.3"/"1.2" from v1.2.3 tags,
# and "sha-<commit>" for every published build. Pull requests build only.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-*.yml"
  pull_request:
    paths:
      - "webapp/**"
      - "custom_components/sourdough_ferment/calc.py"
      - ".github/workflows/webapp-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/webapp-tests.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sourdough-webapp" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Bulk Ferment Timer

      - uses: docker/build-push-action@v7
        with:
          context: webapp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
